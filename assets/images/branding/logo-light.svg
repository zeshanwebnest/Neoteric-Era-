<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 72" width="295" height="72" role="img" aria-labelledby="ntLogoLightTitle">
  <title id="ntLogoLightTitle">Neoteric ERA — Law Firm Digital Marketing Agency</title>
  <!--
    ===========================================================================
    NEOTERIC ERA DIGITAL SERVICES : WHITE LOCKUP
    For DARK backgrounds. See logo-dark.svg for the full construction notes.

    The mark is byte for byte identical to the primary lockup's. Because the
    balance is knocked out of the shield rather than drawn on top of it, the
    holes are transparent and the same shape works on ink, on white or over a
    photograph. Only the wordmark changes:

      NEOTERIC     white, instead of slate-900
      ERA          unchanged, the brand gradient
      descriptor   white at 62 percent, instead of slate-500

    Geometry, advances and vertical placement are identical to the primary
    lockup, so the two cross fade in the header with no shift.

    NOTE FOR EDITORS
    Do not use a run of two or more hyphens anywhere in this file, including
    inside comments. XML forbids it and an SVG loaded through an img element
    is parsed strictly.
    ===========================================================================
  -->
  <defs>
    <linearGradient id="ntBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1"    stop-color="#22D3EE"/>
    </linearGradient>

    <path id="ntN" d="M6 100V6l52 88V6"/>
    <path id="ntE" d="M58 6H6v94h52M6 53h40"/>
    <path id="ntO" d="M32 6a26 47 0 0 1 0 94 26 47 0 0 1 0-94Z"/>
    <path id="ntT" d="M32 100V6M4 6h56"/>
    <path id="ntR" d="M6 100V6h30a24 24 0 0 1 0 48H6m28 0 26 46"/>
    <path id="ntI" d="M6 6v94"/>
    <path id="ntC" d="M58 24a26 47 0 1 0 0 58"/>
    <path id="ntA" d="m6 100 26-94 26 94M17 68h30"/>
    <path id="ntV" d="m6 6 26 94 26-94"/>
    <path id="ntS" d="M58 27C58 15 47 6 32 6 17 6 6 15 6 27 6 39 17 46 32 51 47 56 58 63 58 77 58 89 47 100 32 100 17 100 6 91 6 79"/>
    <path id="ntD" d="M6 100V6h20a32 47 0 0 1 0 94H6"/>
    <path id="ntG" d="M58 24a26 47 0 1 0 0 58V60H36"/>
    <path id="ntL" d="M6 6v94h52"/>
    <path id="ntW" d="M6 6 19 100 32 30 45 100 58 6"/>
    <path id="ntF" d="M6 100V6h52M6 53h40"/>
    <path id="ntM" d="M6 100V6l26 64 26-64v94"/>
    <path id="ntK" d="M6 6v94M58 6 6 53M24 39 58 100"/>
    <path id="ntY" d="M6 6 32 53 58 6M32 53v47"/>
  </defs>

  <!-- ===== Mark: the gavel =====
       Two sub paths only: the crest, and one classical column cut out of it.
       Geometry is identical to logo-dark.svg; the two must never diverge. -->
  <path fill="url(#ntBrand)" fill-rule="evenodd" d="
    M18 6H54A6 6 0 0 1 60 12V40C60 52 50 60 36 66 22 60 12 52 12 40V12A6 6 0 0 1 18 6Z
    M34 14 52 24 46 35 40.1 31.7 31.8 46.5 25.6 43.1 33.9 28.3 28 25Z
    M27 50H45V55H27Z"/>

  <!-- ===== Wordmark: NEOTERIC ===== -->
  <g transform="translate(80.1 5.10) scale(0.195)" fill="none" stroke="#FFFFFF"
     stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntN" x="0"/>
    <use href="#ntE" x="84"/>
    <use href="#ntO" x="168"/>
    <use href="#ntT" x="254"/>
    <use href="#ntE" x="340"/>
    <use href="#ntR" x="424"/>
    <use href="#ntI" x="510"/>
    <use href="#ntC" x="542"/>
  </g>

  <!-- ===== Wordmark: ERA ===== -->
  <g transform="translate(80.1 5.10) scale(0.195)" fill="none" stroke="url(#ntBrand)"
     stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntE" x="653"/>
    <use href="#ntR" x="737"/>
    <use href="#ntA" x="823"/>
  </g>

  <!-- ===== Descriptor line 1: LAW FIRM DIGITAL =====
       stroke plus stroke-opacity rather than an rgba() colour, so the value is
       a plain SVG paint that every renderer resolves the same way. -->
  <g transform="translate(80.2 31.08) scale(0.14)" fill="none"
     stroke="#FFFFFF" stroke-opacity="0.62"
     stroke-width="15" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntL" x="0"/>
    <use href="#ntA" x="93"/>
    <use href="#ntW" x="186"/>
    <use href="#ntF" x="315"/>
    <use href="#ntI" x="408"/>
    <use href="#ntR" x="449"/>
    <use href="#ntM" x="544"/>
    <use href="#ntD" x="673"/>
    <use href="#ntI" x="766"/>
    <use href="#ntG" x="807"/>
    <use href="#ntI" x="900"/>
    <use href="#ntT" x="943"/>
    <use href="#ntA" x="1038"/>
    <use href="#ntL" x="1131"/>
  </g>

  <!-- ===== Descriptor line 2: MARKETING AGENCY ===== -->
  <g transform="translate(80.2 52.84) scale(0.14)" fill="none"
     stroke="#FFFFFF" stroke-opacity="0.62"
     stroke-width="15" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntM" x="0"/>
    <use href="#ntA" x="93"/>
    <use href="#ntR" x="186"/>
    <use href="#ntK" x="281"/>
    <use href="#ntE" x="374"/>
    <use href="#ntT" x="469"/>
    <use href="#ntI" x="564"/>
    <use href="#ntN" x="605"/>
    <use href="#ntG" x="698"/>
    <use href="#ntA" x="827"/>
    <use href="#ntG" x="920"/>
    <use href="#ntE" x="1013"/>
    <use href="#ntN" x="1106"/>
    <use href="#ntC" x="1199"/>
    <use href="#ntY" x="1292"/>
  </g>
</svg>
