<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 72" width="295" height="72" role="img" aria-labelledby="ntLogoLightTitle">
  <title id="ntLogoLightTitle">Neoteric ERA IT Services</title>
  <!--
    ===========================================================================
    NEOTERIC ERA IT SERVICES : WHITE LOCKUP
    For DARK backgrounds. See logo-dark.svg for the full construction and
    metric notes. Geometry, advances and vertical placement are identical to
    the primary lockup, so the two can be cross faded in the header without
    any shift. Only the colours differ.

    The gradient is lifted to the lighter end of the brand ramp so the mark
    holds its presence against a near black field, and the aperture core stays
    ink coloured so it reads as an opening rather than as a dot.

    NOTE FOR EDITORS
    Do not use a run of two or more hyphens anywhere in this file, including
    inside comments. XML forbids it and an SVG loaded through an img element
    is parsed strictly.
    ===========================================================================
  -->
  <defs>
    <linearGradient id="ntGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#818CF8"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1"    stop-color="#67E8F9"/>
    </linearGradient>

    <path id="ntBlade" d="M0 -30C7.2 -30 12 -23.5 12 -15.5 12 -7 6.5 -1.6 0 0-6.5 -1.6 -12 -7 -12 -15.5-12 -23.5 -7.2 -30 0 -30Z"/>

    <path id="ntN" d="M6 100V6l52 88V6"/>
    <path id="ntE" d="M58 6H6v94h52M6 53h40"/>
    <path id="ntO" d="M32 6a26 47 0 0 1 0 94 26 47 0 0 1 0-94Z"/>
    <path id="ntT" d="M32 100V6M4 6h56"/>
    <path id="ntR" d="M6 100V6h30a24 24 0 0 1 0 48H6m28 0 26 46"/>
    <path id="ntI" d="M6 6v94"/>
    <path id="ntC" d="M58 24a26 47 0 1 0 0 58"/>
    <path id="ntA" d="m6 100 26-94 26 94M17 68h30"/>
    <path id="ntV" d="m6 6 26 94 26-94"/>
    <path id="ntS" d="M58 27C58 15 47 6 32 6 17 6 6 15 6 27 6 39 17 46 32 51 47 56 58 63 58 77 58 89 47 100 32 100 17 100 6 91 6 79"/>
  </defs>

  <!-- ===== Mark ===== -->
  <g transform="translate(36 36)">
    <g fill="url(#ntGradA)">
      <use href="#ntBlade" transform="rotate(0)   scale(1)"    opacity="1"/>
      <use href="#ntBlade" transform="rotate(60)  scale(0.92)" opacity="0.88"/>
      <use href="#ntBlade" transform="rotate(120) scale(0.84)" opacity="0.76"/>
      <use href="#ntBlade" transform="rotate(180) scale(0.76)" opacity="0.64"/>
      <use href="#ntBlade" transform="rotate(240) scale(0.68)" opacity="0.52"/>
      <use href="#ntBlade" transform="rotate(300) scale(0.60)" opacity="0.40"/>
    </g>
    <circle r="4.6" fill="#0A0E1C"/>
  </g>

  <!-- ===== Wordmark: NEOTERIC ===== -->
  <g transform="translate(80.1 14.2) scale(0.235)" fill="none" stroke="#FFFFFF"
     stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntN" x="0"/>
    <use href="#ntE" x="84"/>
    <use href="#ntO" x="168"/>
    <use href="#ntT" x="254"/>
    <use href="#ntE" x="340"/>
    <use href="#ntR" x="424"/>
    <use href="#ntI" x="510"/>
    <use href="#ntC" x="542"/>
  </g>

  <!-- ===== Wordmark: ERA ===== -->
  <g transform="translate(80.1 14.2) scale(0.235)" fill="none" stroke="url(#ntGradA)"
     stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntE" x="653"/>
    <use href="#ntR" x="737"/>
    <use href="#ntA" x="823"/>
  </g>

  <!-- ===== Descriptor: IT SERVICES =====
       stroke plus stroke-opacity rather than an rgba() colour, so the value
       is a plain SVG paint that every renderer resolves the same way. -->
  <g transform="translate(80.2 46.4) scale(0.107)" fill="none"
     stroke="#FFFFFF" stroke-opacity="0.66"
     stroke-width="15" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntI" x="0"/>
    <use href="#ntT" x="61"/>
    <use href="#ntS" x="235"/>
    <use href="#ntE" x="346"/>
    <use href="#ntR" x="457"/>
    <use href="#ntV" x="570"/>
    <use href="#ntI" x="681"/>
    <use href="#ntC" x="740"/>
    <use href="#ntE" x="851"/>
    <use href="#ntS" x="962"/>
  </g>
</svg>
