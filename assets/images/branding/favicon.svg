<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="ntFavTitle">
  <title id="ntFavTitle">Neoteric ERA</title>
  <!-- Favicon build. Blade count is unchanged but the scale steps are
       compressed and the centre opening enlarged, so the aperture still reads
       as one deliberate shape at 16px. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <path id="b" d="M0 -30C7.2 -30 12 -23.5 12 -15.5 12 -7 6.5 -1.6 0 0-6.5 -1.6 -12 -7 -12 -15.5-12 -23.5 -7.2 -30 0 -30Z"/>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0A0E1C"/>
  <g transform="translate(32 32) scale(0.84)">
    <g fill="url(#g)">
      <use href="#b" transform="rotate(0)   scale(1)"    opacity="1"/>
      <use href="#b" transform="rotate(60)  scale(0.94)" opacity="0.9"/>
      <use href="#b" transform="rotate(120) scale(0.88)" opacity="0.8"/>
      <use href="#b" transform="rotate(180) scale(0.82)" opacity="0.7"/>
      <use href="#b" transform="rotate(240) scale(0.76)" opacity="0.6"/>
      <use href="#b" transform="rotate(300) scale(0.70)" opacity="0.5"/>
    </g>
    <circle r="6" fill="#0A0E1C"/>
  </g>
</svg>
