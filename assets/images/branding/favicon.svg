<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="ntFavTitle">
  <title id="ntFavTitle">Neoteric ERA</title>
  <!--
    Favicon build. Deliberately NOT the lockup scaled down. Two changes: the crest
    becomes a rounded tile, because the two silhouettes are indistinguishable at
    16px, and the plinth is dropped, because a 4 unit bar disappears entirely at
    that size and only muddies the letter. The N is left to carry it alone.

    Same brand gradient, same evenodd knockout.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1"    stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <path fill="url(#g)" fill-rule="evenodd" d="
    M14 0H50A14 14 0 0 1 64 14V50A14 14 0 0 1 50 64H14A14 14 0 0 1 0 50V14A14 14 0 0 1 14 0Z
    M17 14H27L37 28V14H47V50H37L27 36V50H17Z"/>
</svg>
