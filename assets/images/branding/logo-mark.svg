<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" role="img" aria-labelledby="ntMarkTitle">
  <title id="ntMarkTitle">Neoteric ERA gavel mark</title>
  <!--
    A crest with one classical column cut out of it: capital, shaft, base,
    drawn as a single continuous outline.

    An earlier build put a whole portico in here, six separate knockouts. At
    the size a logo is actually seen that reads as clutter rather than as a
    symbol. One column says the same thing and survives being small, which is
    what restraint buys.

    Two sub paths total. The knockout is transparent, so this one file works on
    light backgrounds, dark ones, or over a photograph.

    Symmetrical about x=36. Holds to about 20px; below that use favicon.svg.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1"    stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <path fill="url(#g)" fill-rule="evenodd" d="
    M18 6H54A6 6 0 0 1 60 12V40C60 52 50 60 36 66 22 60 12 52 12 40V12A6 6 0 0 1 18 6Z
    M34 14 52 24 46 35 40.1 31.7 31.8 46.5 25.6 43.1 33.9 28.3 28 25Z
    M27 50H45V55H27Z"/>
</svg>
