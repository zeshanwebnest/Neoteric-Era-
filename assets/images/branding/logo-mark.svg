<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" role="img" aria-labelledby="ntMarkTitle">
  <title id="ntMarkTitle">Neoteric ERA aperture mark</title>
  <!-- Standalone aperture mark: six tapered blades rotating around a common
       centre, stepping down in scale and opacity to describe momentum. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <path id="b" d="M0 -30C7.2 -30 12 -23.5 12 -15.5 12 -7 6.5 -1.6 0 0-6.5 -1.6 -12 -7 -12 -15.5-12 -23.5 -7.2 -30 0 -30Z"/>
  </defs>
  <g transform="translate(36 36)">
    <g fill="url(#g)">
      <use href="#b" transform="rotate(0)   scale(1)"    opacity="1"/>
      <use href="#b" transform="rotate(60)  scale(0.92)" opacity="0.88"/>
      <use href="#b" transform="rotate(120) scale(0.84)" opacity="0.76"/>
      <use href="#b" transform="rotate(180) scale(0.76)" opacity="0.64"/>
      <use href="#b" transform="rotate(240) scale(0.68)" opacity="0.52"/>
      <use href="#b" transform="rotate(300) scale(0.60)" opacity="0.40"/>
    </g>
    <circle r="4.6" fill="#0F172A"/>
  </g>
</svg>
