<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" role="img" aria-labelledby="ntMarkTitle">
  <title id="ntMarkTitle">Neoteric ERA aegis mark</title>
  <!--
    Standalone aegis mark: a shield with a balance knocked out of it. Identical
    geometry to the mark inside the full lockups, so the two never drift.

    Because the balance is a knockout rather than a drawn shape, the holes are
    transparent and this single file works on light backgrounds, dark ones, or
    over a photograph. There is no separate light or dark variant to maintain.

    Use where the wordmark will not fit: app icons, avatars, watermarks,
    social profile images. Holds down to about 24px. Below that use
    favicon.svg, which is redrawn with heavier elements.

    Everything is centred on x=36; the pans are a mirrored pair at 36 +- 12.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1"    stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <path fill="url(#g)" fill-rule="evenodd" d="
    M18 6H54A6 6 0 0 1 60 12V34C60 48 50 58.5 36 66 22 58.5 12 48 12 34V12A6 6 0 0 1 18 6Z
    M33 20H39V26H55V32H39V47H47V53H25V47H33V32H17V26H33Z
    M18 36H30L24 44Z
    M42 36H54L48 44Z"/>
</svg>
