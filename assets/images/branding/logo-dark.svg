<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 72" width="295" height="72" role="img" aria-labelledby="ntLogoDarkTitle">
  <title id="ntLogoDarkTitle">Neoteric ERA IT Services</title>
  <!--
    ===========================================================================
    NEOTERIC ERA IT SERVICES : PRIMARY LOCKUP
    For LIGHT backgrounds (dark wordmark). This is the main logo.
    ===========================================================================
    MARK : "The Aperture"
    Six tapered blades rotate around a common centre, each stepping down in
    scale and opacity along the brand gradient. Read clockwise it describes
    momentum; read whole it forms a soft hexagonal aperture around a dark core.

    WORDMARK
    Set in outlined geometric letterforms rather than live text, so it renders
    identically with or without a webfont. Built on a 64 x 100 grid with a
    13 unit stroke.

    METRICS : how the letter positions are derived
    The stroke is centred on the path, so each glyph's visual ink extends half
    a stroke width beyond its centreline on both sides. Advances are therefore
    computed from INK extents, not from path coordinates:

        half stroke        = 6.5
        standard glyph ink = -0.5 .. 64.5   (centreline 6 .. 58)
        T ink              = -2.5 .. 66.5   (wider crossbar)
        R ink              = -0.5 .. 66.5   (leg kicks right)
        I ink              = -0.5 .. 12.5   (single stem)

        x(n) = inkEnd(n-1) + gap - inkStart(n)

    with gap = 19 between letters and 46 between words. Every optical gap in
    the lockup is therefore identical, which is what makes the line read as
    evenly set rather than as a row of separate glyphs. Deriving the advances
    from path coordinates instead produces gaps of 13 to 19 and a word space
    barely wider than a letter space, so NEOTERIC and ERA run together.

    NOTE FOR EDITORS
    Do not use a run of two or more hyphens anywhere in this file, including
    inside comments. XML forbids it, and an SVG loaded through an img element
    is parsed strictly, so a single occurrence turns the whole logo into a
    broken image icon while leaving the surrounding HTML page fine.
    ===========================================================================
  -->
  <defs>
    <linearGradient id="ntGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1"    stop-color="#22D3EE"/>
    </linearGradient>

    <!-- One blade, drawn pointing up from the centre -->
    <path id="ntBlade" d="M0 -30C7.2 -30 12 -23.5 12 -15.5 12 -7 6.5 -1.6 0 0-6.5 -1.6 -12 -7 -12 -15.5-12 -23.5 -7.2 -30 0 -30Z"/>

    <!-- Geometric monoline letterforms. Every glyph spans y 6 to 100 so the
         cap height and baseline are shared across the whole alphabet. -->
    <path id="ntN" d="M6 100V6l52 88V6"/>
    <path id="ntE" d="M58 6H6v94h52M6 53h40"/>
    <path id="ntO" d="M32 6a26 47 0 0 1 0 94 26 47 0 0 1 0-94Z"/>
    <path id="ntT" d="M32 100V6M4 6h56"/>
    <path id="ntR" d="M6 100V6h30a24 24 0 0 1 0 48H6m28 0 26 46"/>
    <path id="ntI" d="M6 6v94"/>
    <path id="ntC" d="M58 24a26 47 0 1 0 0 58"/>
    <path id="ntA" d="m6 100 26-94 26 94M17 68h30"/>
    <path id="ntV" d="m6 6 26 94 26-94"/>
    <!-- S drawn as cubics so it fills the same 6 to 100 band as the rest of
         the set. The previous arc based version ran 22 to 72, which left it
         floating at half height and off the baseline. -->
    <path id="ntS" d="M58 27C58 15 47 6 32 6 17 6 6 15 6 27 6 39 17 46 32 51 47 56 58 63 58 77 58 89 47 100 32 100 17 100 6 91 6 79"/>
  </defs>

  <!-- ===== Mark ===== -->
  <g transform="translate(36 36)">
    <g fill="url(#ntGradA)">
      <use href="#ntBlade" transform="rotate(0)   scale(1)"    opacity="1"/>
      <use href="#ntBlade" transform="rotate(60)  scale(0.92)" opacity="0.88"/>
      <use href="#ntBlade" transform="rotate(120) scale(0.84)" opacity="0.76"/>
      <use href="#ntBlade" transform="rotate(180) scale(0.76)" opacity="0.64"/>
      <use href="#ntBlade" transform="rotate(240) scale(0.68)" opacity="0.52"/>
      <use href="#ntBlade" transform="rotate(300) scale(0.60)" opacity="0.40"/>
    </g>
    <circle r="4.6" fill="#0F172A"/>
  </g>

  <!-- ===== Wordmark: NEOTERIC =====
       Ink starts at x 80.0 and the whole two line block is vertically centred
       in the 72 unit height. ERA below shares this transform exactly, so both
       words sit on one baseline with no possibility of drift. -->
  <g transform="translate(80.1 14.2) scale(0.235)" fill="none" stroke="#0F172A"
     stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntN" x="0"/>
    <use href="#ntE" x="84"/>
    <use href="#ntO" x="168"/>
    <use href="#ntT" x="254"/>
    <use href="#ntE" x="340"/>
    <use href="#ntR" x="424"/>
    <use href="#ntI" x="510"/>
    <use href="#ntC" x="542"/>
  </g>

  <!-- ===== Wordmark: ERA =====
       Same transform as NEOTERIC; only the x offsets and the stroke differ.
       The 46 unit word gap is 2.4x the 19 unit letter gap, so the two words
       read as two words rather than as NEOTERICERA. -->
  <g transform="translate(80.1 14.2) scale(0.235)" fill="none" stroke="url(#ntGradA)"
     stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntE" x="653"/>
    <use href="#ntR" x="737"/>
    <use href="#ntA" x="823"/>
  </g>

  <!-- ===== Descriptor: IT SERVICES =====
       Left edge aligned to the wordmark at x 80.0. Tracking is opened to 44
       units (105 between words) because small caps need more air than display
       caps to stay legible at header size. Half stroke here is 7.5, so the
       advances differ from the wordmark's. -->
  <g transform="translate(80.2 46.4) scale(0.107)" fill="none" stroke="#64748B"
     stroke-width="15" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntI" x="0"/>
    <use href="#ntT" x="61"/>
    <use href="#ntS" x="235"/>
    <use href="#ntE" x="346"/>
    <use href="#ntR" x="457"/>
    <use href="#ntV" x="570"/>
    <use href="#ntI" x="681"/>
    <use href="#ntC" x="740"/>
    <use href="#ntE" x="851"/>
    <use href="#ntS" x="962"/>
  </g>
</svg>
