<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 72" width="295" height="72" role="img" aria-labelledby="ntLogoDarkTitle">
  <title id="ntLogoDarkTitle">Neoteric ERA Digital Services</title>
  <!--
    ===========================================================================
    NEOTERIC ERA DIGITAL SERVICES : PRIMARY LOCKUP
    For LIGHT backgrounds (ink wordmark). This is the main logo.
    ===========================================================================
    MARK : "The Aegis"
    A shield with a balance knocked out of it. Shield for protection and
    standing, balance for justice, and a stepped plinth that reads as the base
    of a courthouse column. Three legal signals in one silhouette.

    WHY IT IS BUILT AS A KNOCKOUT, NOT AS STROKES
    The previous mark drew a balance with 5 unit strokes across seven separate
    paths. At header size that is roughly 3px of line scattered over 44px of
    space, and it read as specks rather than as a symbol. This version inverts
    the approach: one solid mass, with the balance removed from it using
    fill-rule="evenodd". The thinnest element is now 6 grid units:

        44px tall  ->  3.7px      32px  ->  2.7px      24px  ->  2.0px

    A solid shape also means the knockouts are genuinely transparent, so the
    identical mark sits on white, on ink, or on a photograph with no variant
    needed. Only the wordmark colour changes between lockups.

    COLOUR
    The grad-brand token, exactly as the site defines it and uses it seventeen times
    across headings, buttons and cards:

        #4F46E5  ->  #7C3AED  ->  #22D3EE

    No colour is introduced that is not already in the stylesheet. The wordmark
    is slate-900 and the descriptor slate-500, which are the site's own
    primary and tertiary text colours.

    GEOMETRY
    Everything is centred on x=36. The pans are a mirrored pair at 36 +- 12.
    Verify symmetry numerically after any edit; it is the first thing to go
    when paths are nudged by eye.

    NOTE FOR EDITORS
    Do not use a run of two or more hyphens anywhere in this file, including
    inside comments. XML forbids it, and an SVG loaded through an img element
    is parsed strictly, so one occurrence turns the whole logo into a broken
    image icon while leaving the surrounding HTML page fine.
    ===========================================================================
  -->
  <defs>
    <linearGradient id="ntBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1"    stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Geometric monoline letterforms. Every glyph spans y 6 to 100 so the
         cap height and baseline are shared across the whole alphabet. -->
    <path id="ntN" d="M6 100V6l52 88V6"/>
    <path id="ntE" d="M58 6H6v94h52M6 53h40"/>
    <path id="ntO" d="M32 6a26 47 0 0 1 0 94 26 47 0 0 1 0-94Z"/>
    <path id="ntT" d="M32 100V6M4 6h56"/>
    <path id="ntR" d="M6 100V6h30a24 24 0 0 1 0 48H6m28 0 26 46"/>
    <path id="ntI" d="M6 6v94"/>
    <path id="ntC" d="M58 24a26 47 0 1 0 0 58"/>
    <path id="ntA" d="m6 100 26-94 26 94M17 68h30"/>
    <path id="ntV" d="m6 6 26 94 26-94"/>
    <path id="ntS" d="M58 27C58 15 47 6 32 6 17 6 6 15 6 27 6 39 17 46 32 51 47 56 58 63 58 77 58 89 47 100 32 100 17 100 6 91 6 79"/>
    <path id="ntD" d="M6 100V6h20a32 47 0 0 1 0 94H6"/>
    <path id="ntG" d="M58 24a26 47 0 1 0 0 58V60H36"/>
    <path id="ntL" d="M6 6v94h52"/>
  </defs>

  <!-- ===== Mark: the aegis =====
       One path. Sub path 1 is the shield, sub paths 2 to 4 are the balance and
       its two pans. evenodd turns them into holes rather than filled shapes. -->
  <path fill="url(#ntBrand)" fill-rule="evenodd" d="
    M18 6H54A6 6 0 0 1 60 12V34C60 48 50 58.5 36 66 22 58.5 12 48 12 34V12A6 6 0 0 1 18 6Z
    M33 20H39V26H55V32H39V47H47V53H25V47H33V32H17V26H33Z
    M18 36H30L24 44Z
    M42 36H54L48 44Z"/>

  <!-- ===== Wordmark: NEOTERIC =====
       Ink starts at x 80.0 and the two line block is vertically centred in the
       72 unit height. ERA below shares this transform exactly, so both words
       sit on one baseline with no possibility of drift.

       Advances are computed from INK extents, not path coordinates, because
       the stroke is centred on the path and extends half a width past it:
           x(n) = inkEnd(n-1) + gap - inkStart(n)
       with gap 19 between letters and 46 between words. -->
  <g transform="translate(80.1 14.2) scale(0.235)" fill="none" stroke="#0F172A"
     stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntN" x="0"/>
    <use href="#ntE" x="84"/>
    <use href="#ntO" x="168"/>
    <use href="#ntT" x="254"/>
    <use href="#ntE" x="340"/>
    <use href="#ntR" x="424"/>
    <use href="#ntI" x="510"/>
    <use href="#ntC" x="542"/>
  </g>

  <!-- ===== Wordmark: ERA =====
       Gradient filled, mirroring how the site sets accent words in headings
       with .heading-accent. Same transform as NEOTERIC, so no drift. -->
  <g transform="translate(80.1 14.2) scale(0.235)" fill="none" stroke="url(#ntBrand)"
     stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntE" x="653"/>
    <use href="#ntR" x="737"/>
    <use href="#ntA" x="823"/>
  </g>

  <!-- ===== Descriptor: DIGITAL SERVICES =====
       Tracking is opened to 44 units (105 between words) because small caps
       need more air than display caps to stay legible at header size. Half
       stroke here is 7.5, so the advances differ from the wordmark's. -->
  <g transform="translate(80.2 46.4) scale(0.107)" fill="none" stroke="#64748B"
     stroke-width="15" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#ntD" x="0"/>
    <use href="#ntI" x="111"/>
    <use href="#ntG" x="170"/>
    <use href="#ntI" x="281"/>
    <use href="#ntT" x="342"/>
    <use href="#ntA" x="455"/>
    <use href="#ntL" x="566"/>
    <use href="#ntS" x="738"/>
    <use href="#ntE" x="849"/>
    <use href="#ntR" x="960"/>
    <use href="#ntV" x="1073"/>
    <use href="#ntI" x="1184"/>
    <use href="#ntC" x="1243"/>
    <use href="#ntE" x="1354"/>
    <use href="#ntS" x="1465"/>
  </g>
</svg>
